<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Goodform — sieć (podgląd 2)</title>
<style>
  :root { --bg:#05050a; --text:#f5f0e8; --muted:#9aa3a8; --coral:#ff6847; --mint:#82e6df; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:220vh; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; pointer-events:none; }
  .veil { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 55% at 18% 28%, rgba(5,5,10,.15), transparent 55%),
      linear-gradient(180deg, rgba(5,5,10,.18), transparent 22%, transparent 78%, rgba(5,5,10,.45));
  }
  .ui { position:relative; z-index:2; padding:32px; max-width:560px; }
  .brand { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--mint); }
  h1 { font-size:clamp(32px,4.4vw,52px); line-height:1.05; font-weight:560; margin:10px 0 12px; }
  h1 em { color:var(--coral); font-style:normal; }
  p { color:var(--muted); line-height:1.55; max-width:42ch; }
  .note { margin-top:28px; font-size:13px; color:#6f777c; }
  .spacer { height:140vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="veil"></div>
<div class="ui">
  <div class="brand">Goodform · wariant 2</div>
  <h1>Węzły i <em>połączenia.</em></h1>
  <p>Rusz myszką i przewiń stronę. Sieć zgęstnieje przy kursorze, fale idą od kliknięcia, pakiety lecą po krawędziach.</p>
  <p class="note">Podgląd — noindex. To nie jest jeszcze home.</p>
</div>
<div class="spacer" aria-hidden="true"></div>
<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const mouse = { x: 0.58, y: 0.36, tx: 0.58, ty: 0.36, vx: 0, vy: 0 };
  let w = 0, h = 0, dpr = 1, scroll = 0, tscroll = 0;
  let nodes = [], sparks = [], ripples = [];
  const CORAL = [255, 104, 71];
  const MINT = [130, 230, 223];
  const VIOLET = [155, 116, 255];
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const lerp = (a, b, n) => a + (b - a) * n;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hash = (i, s) => {
    const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453;
    return x - Math.floor(x);
  };
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 1.75);
    w = innerWidth; h = innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }
  function build() {
    const count = reduce ? 28 : clamp(Math.round((w * h) / 18000), 36, 72);
    nodes = Array.from({ length: count }, (_, i) => ({
      bx: hash(i, 1), by: hash(i, 2),
      z: 0.35 + hash(i, 3) * 0.65,
      phase: hash(i, 4) * Math.PI * 2,
      spin: 0.15 + hash(i, 5) * 0.55,
      hue: hash(i, 6) < 0.12 ? CORAL : hash(i, 7) < 0.22 ? VIOLET : MINT,
      pulse: hash(i, 8)
    }));
    sparks = []; ripples = [];
  }
  function pos(n, now) {
    const driftX = Math.sin(now * 0.00018 * n.spin + n.phase) * 0.035 * n.z;
    const driftY = Math.cos(now * 0.00014 * n.spin + n.phase * 1.3) * 0.028 * n.z;
    const parX = (mouse.x - 0.5) * 0.07 * n.z;
    const parY = (mouse.y - 0.5) * 0.05 * n.z;
    const sc = (scroll - 0.5) * 0.06 * n.z;
    return {
      x: 48 + (n.bx + driftX + parX) * (w - 96),
      y: 40 + (n.by + driftY + parY + sc) * (h - 80)
    };
  }
  addEventListener("resize", resize, { passive: true });
  addEventListener("pointermove", (e) => {
    const nx = e.clientX / w, ny = e.clientY / h;
    mouse.vx = nx - mouse.tx; mouse.vy = ny - mouse.ty;
    mouse.tx = nx; mouse.ty = ny;
  }, { passive: true });
  addEventListener("pointerdown", (e) => {
    ripples.push({ x: e.clientX, y: e.clientY, r: 8, life: 1 });
    if (reduce) return;
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 0.6 + Math.random() * 2.2;
      sparks.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, c: Math.random() < 0.45 ? CORAL : MINT });
    }
  });
  addEventListener("scroll", () => {
    const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    tscroll = scrollY / max;
  }, { passive: true });
  let lastPacket = 0;
  function maybePacket(now, pts) {
    if (reduce || now - lastPacket < 420 || pts.length < 2) return;
    if (Math.random() > 0.08) return;
    const a = pts[(Math.random() * pts.length) | 0];
    const b = pts[(Math.random() * pts.length) | 0];
    if (a === b) return;
    lastPacket = now;
    sparks.push({ x: a.x, y: a.y, tx: b.x, ty: b.y, packet: true, life: 1, c: CORAL });
  }
  function frame(now) {
    mouse.x = lerp(mouse.x, mouse.tx, 0.07);
    mouse.y = lerp(mouse.y, mouse.ty, 0.07);
    scroll = lerp(scroll, tscroll, 0.06);
    const speed = Math.hypot(mouse.vx, mouse.vy);
    mouse.vx *= 0.86; mouse.vy *= 0.86;
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, w, h);
    const glow = ctx.createRadialGradient(mouse.x * w, mouse.y * h, 20, mouse.x * w, mouse.y * h, 340);
    glow.addColorStop(0, "rgba(130,230,223,0.07)");
    glow.addColorStop(0.45, "rgba(155,116,255,0.03)");
    glow.addColorStop(1, "rgba(5,5,10,0)");
    ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
    const pts = nodes.map((n) => { const p = pos(n, now); n.px = p.x; n.py = p.y; return n; });
    const mx = mouse.x * w, my = mouse.y * h;
    const linkDist = reduce ? 120 : 168;
    const influence = 210 + speed * 420;
    ctx.lineWidth = 1;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      for (let j = i + 1; j < pts.length; j++) {
        const b = pts[j];
        const d = Math.hypot(a.px - b.px, a.py - b.py);
        if (d > linkDist || d < 8) continue;
        const near = Math.min(Math.hypot(a.px - mx, a.py - my), Math.hypot(b.px - mx, b.py - my));
        if (near > influence) continue;
        const alpha = (1 - d / linkDist) * (1 - near / influence) * 0.62;
        ctx.strokeStyle = rgba(near < 90 + speed * 80 ? CORAL : MINT, alpha);
        ctx.beginPath(); ctx.moveTo(a.px, a.py); ctx.lineTo(b.px, b.py); ctx.stroke();
      }
    }
    maybePacket(now, pts.map(n => ({ x: n.px, y: n.py })));
    pts.forEach((n) => {
      const d = Math.hypot(n.px - mx, n.py - my);
      const beat = 0.55 + Math.sin(now * 0.003 + n.pulse * 8) * 0.45;
      const r = (d < 150 ? 2.8 : 1.35) * (0.75 + n.z * 0.5) * (reduce ? 1 : beat);
      ctx.fillStyle = rgba(d < 110 ? CORAL : n.hue, d < 230 ? 0.92 : 0.18 + n.z * 0.2);
      ctx.beginPath(); ctx.arc(n.px, n.py, r, 0, Math.PI * 2); ctx.fill();
      if (d < 130 && !reduce) {
        ctx.strokeStyle = rgba(n.hue, 0.16 * beat);
        ctx.beginPath(); ctx.arc(n.px, n.py, r + 6 + beat * 4, 0, Math.PI * 2); ctx.stroke();
      }
    });
    ctx.fillStyle = rgba(CORAL, 0.9);
    ctx.beginPath(); ctx.arc(mx, my, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = rgba(MINT, 0.22);
    ctx.beginPath(); ctx.arc(mx, my, 16 + Math.sin(now * 0.004) * 3 + speed * 28, 0, Math.PI * 2); ctx.stroke();
    ripples = ripples.filter((r) => r.life > 0);
    ripples.forEach((r) => {
      r.r += 3.4; r.life -= 0.016;
      ctx.strokeStyle = rgba(CORAL, r.life * 0.35);
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = rgba(MINT, r.life * 0.18);
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.62, 0, Math.PI * 2); ctx.stroke();
    });
    sparks = sparks.filter((s) => s.life > 0);
    sparks.forEach((s) => {
      if (s.packet) {
        s.x = lerp(s.x, s.tx, 0.08); s.y = lerp(s.y, s.ty, 0.08); s.life -= 0.012;
        ctx.fillStyle = rgba(s.c, s.life);
        ctx.beginPath(); ctx.arc(s.x, s.y, 2.6, 0, Math.PI * 2); ctx.fill();
      } else {
        s.x += s.vx; s.y += s.vy; s.vx *= 0.96; s.vy *= 0.96; s.life -= 0.02;
        ctx.fillStyle = rgba(s.c, s.life * 0.8);
        ctx.beginPath(); ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2); ctx.fill();
      }
    });
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
