<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://formspree.io https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; upgrade-insecure-requests"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>

<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Goodform — sieć (podgląd 2)</title>
<style>
  :root { --bg:#05050a; --text:#f5f0e8; --muted:#9aa3a8; --coral:#ff6847; --mint:#82e6df; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:220vh; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; pointer-events:none; }
  .veil { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 55% at 18% 28%, rgba(5,5,10,.15), transparent 55%),
      linear-gradient(180deg, rgba(5,5,10,.18), transparent 22%, transparent 78%, rgba(5,5,10,.45));
  }
  .ui { position:relative; z-index:2; padding:32px; max-width:560px; }
  .brand { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--mint); }
  h1 { font-size:clamp(32px,4.4vw,52px); line-height:1.05; font-weight:560; margin:10px 0 12px; }
  h1 em { color:var(--coral); font-style:normal; }
  p { color:var(--muted); line-height:1.55; max-width:42ch; }
  .note { margin-top:28px; font-size:13px; color:#6f777c; }
  .spacer { height:140vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="veil"></div>
<div class="ui">
  <div class="brand">Goodform · wariant 2</div>
  <h1>Węzły i <em>połączenia</em></h1>
  <p>Rusz myszką i przewiń stronę. Sieć zgęstnieje przy kursorze, fale idą od kliknięcia, pakiety lecą po krawędziach.</p>
  <p class="note">Podgląd — noindex. To nie jest jeszcze home.</p>
</div>
<div class="spacer" aria-hidden="true"></div>
<script src="js/preview-bg-inline.js"></script>
</body>
</html>
